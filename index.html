<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Digga-Digga"><meta name="theme-color" content="#140d0a">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Digga-Digga</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen arcade cabinet — HUD strip, board, thumb controls (side controls in landscape) */
:root{
  --bg:#140d0a; --panel:#221712; --panel2:#2e2019; --ink:#f7ecdc; --muted:#b89e86;
  --accent:#ffb52e; --gem:#3fe59b; --danger:#ff5468; --cool:#59d6ff;
  --display:'Bungee','Arial Black',Impact,system-ui,sans-serif;
  --ui:'Chakra Petch','Segoe UI',Roboto,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(120% 70% at 50% 0%,#2a1a12 0%,var(--bg) 60%)}
#app{height:100%;box-sizing:border-box;display:grid;gap:10px;
  grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"hud hud" "board board" "dpad fire";
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  max-width:760px;margin:0 auto}
@media (orientation:landscape) and (max-height:620px){
  #app{max-width:none;gap:8px;padding-block:6px;grid-template-columns:auto 1fr auto;grid-template-rows:40px minmax(0,1fr);grid-template-areas:"dpad hud fire" "dpad board fire";align-items:center}
  #joy,#fireWrap{align-self:center}
  #board{align-self:stretch;justify-self:stretch}
}
/* Sideways on a touch screen (body.full): the map fills the whole screen; scores, joystick and Fire float on top.
   The joystick and Fire only show while a level is being played, so they never cover the menus. */
body.full #app{display:block;padding:0;max-width:none}
body.full #board{position:fixed;inset:44px 0 0 0}
body.full canvas#cv{border-radius:0;box-shadow:none}
body.full.fill #board{inset:0}
body.full.fill canvas#cv{border-radius:0;box-shadow:none;background:#0e0806}
body.full #ov{border-radius:0}
body.full #hud{position:fixed;z-index:3;top:0;left:0;right:0;height:46px;box-sizing:border-box;pointer-events:none;
  padding:4px max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));
  background:linear-gradient(rgba(14,8,6,.78),rgba(14,8,6,.45) 70%,rgba(14,8,6,0));text-shadow:0 1px 3px #000}
body.full .hbtns{pointer-events:auto}
body.full #joy{position:fixed;z-index:3;left:max(10px,env(safe-area-inset-left,0px));bottom:10px;width:100px;height:100px;opacity:.72}
body.full #ring{inset:10px}
body.full #knob{width:38px;height:38px;margin:-19px 0 0 -19px}
body.full #fireWrap{position:fixed;z-index:3;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;opacity:.85}
body.full #fire{width:62px;height:62px}
body.full #fire::after{inset:5px;font-size:12px}
body.full #fireWrap .hint{display:none}
body.full:not(.playing) #joy,body.full:not(.playing) #fireWrap{display:none}
/* Full screen: the whole bottom-left of the screen is the joystick. Put a thumb down anywhere there and the stick
   jumps under it; slide to move, hold to keep going. The stick rests in the corner when not touched. */
#jzone{display:none}
body.full.playing:not(.kb) #jzone{display:block;position:fixed;z-index:4;left:0;bottom:0;width:45vw;height:calc(100vh - 56px);touch-action:none}
body.full #joy{pointer-events:none;transition:opacity .15s}
body.full #joy.on{opacity:.9}
/* Phones and tablets play sideways only: upright shows a "turn sideways" screen */
#rot{display:none}
@media (orientation:portrait) and (pointer:coarse){
  #rot{display:flex;position:fixed;inset:0;z-index:50;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;background:var(--bg)}
  #rot svg{width:96px;height:96px;animation:rot 2.4s ease-in-out infinite}
  #rot b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--accent)}
  #rot span{color:var(--muted);font-size:15px;max-width:26ch;line-height:1.4}
  #app{visibility:hidden}
}
@keyframes rot{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){#rot svg{animation:none;transform:rotate(-90deg)}}
#hud{grid-area:hud;display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.stat{display:flex;flex-direction:column;line-height:1.05;flex:none}
.stat b{font-family:var(--display);font-weight:400;font-size:clamp(16px,4.6vw,24px);letter-spacing:.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat span{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
#lives{display:flex;gap:3px;align-items:center;min-height:18px}
#lives svg{width:20px;height:16px}
.hbtns{display:flex;gap:6px}
.ibtn{width:34px;height:34px;border-radius:10px;border:1px solid #4a3528;background:var(--panel);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.ibtn:focus-visible,.pbtn:focus-visible,#fire:focus-visible,.dbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ibtn svg{width:18px;height:18px}
#board{grid-area:board;position:relative;min-width:0;min-height:0;display:grid;place-items:center}
#stage{position:relative}
canvas#cv{display:block;border-radius:12px;box-shadow:0 0 0 2px #4b3426,0 0 0 6px #1b110c,0 14px 40px rgba(0,0,0,.6);background:#3a2418}
#ov{position:absolute;inset:0;z-index:2;overflow-y:auto;display:flex;text-align:center;border-radius:12px;padding:14px;box-sizing:border-box}
#ov.dim{background:rgba(14,8,6,.72);backdrop-filter:blur(2px)}
#ov[hidden]{display:none!important}
.ovin{margin:auto;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:440px}
.logo{font-family:var(--display);font-size:clamp(30px,9vw,58px);line-height:.9;color:var(--accent);
  text-shadow:0 3px 0 #9a4a10,0 6px 0 #5a2808,0 10px 24px rgba(0,0,0,.6);letter-spacing:.01em;text-wrap:balance}
.logo em{font-style:normal;color:var(--gem);text-shadow:0 3px 0 #0f7a48,0 6px 0 #064228,0 10px 24px rgba(0,0,0,.6)}
.big{font-family:var(--display);font-size:clamp(24px,7vw,40px);color:var(--ink);text-shadow:0 3px 0 rgba(0,0,0,.5)}
.sub{color:var(--muted);font-size:14px;max-width:38ch;line-height:1.4;text-wrap:balance}
.how{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;text-align:left;font-size:12.5px;color:var(--ink);background:rgba(0,0,0,.25);padding:8px 12px;border-radius:10px}
.how i{font-style:normal;color:var(--accent);font-weight:700}
.pbtn{font-family:var(--display);font-size:20px;color:#2a1405;background:linear-gradient(#ffd560,#ff9b1f);border:none;border-radius:14px;padding:12px 30px;cursor:pointer;box-shadow:0 4px 0 #9a4a10,0 8px 18px rgba(0,0,0,.4)}
.lnk{background:none;border:none;color:var(--muted);font-family:var(--ui);font-size:13px;text-decoration:underline;cursor:pointer;padding:6px}
.lvpick{display:flex;align-items:center;gap:10px;width:100%;max-width:340px}.lvpick input{flex:1;min-width:0;accent-color:var(--accent)}
.lvs{width:40px;height:40px;border-radius:10px;border:1px solid #4a3528;background:var(--panel2);color:var(--ink);font-size:22px;cursor:pointer;flex:none}
.lvnum{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}.lvnum b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--ink)}
.lvb{font-family:var(--display);font-size:16px;background:var(--panel2);color:var(--ink);border:1px solid #4a3528;border-radius:8px;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.lvb small{font-family:var(--ui);font-size:8px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.devopts{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:13px}
.devopts input{accent-color:var(--accent)}
#lv small{font-family:var(--ui);font-size:10px;color:var(--accent);letter-spacing:.1em;margin-left:4px}
.drow{display:flex;gap:10px}.pbtn.alt{background:linear-gradient(#7ff0c0,#2fc987);box-shadow:0 4px 0 #0f6b44,0 8px 18px rgba(0,0,0,.4);color:#06281a}
.pbtn.sm{font-size:16px;padding:8px 18px}
.viewbar{margin-top:auto;align-self:stretch;pointer-events:auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;background:rgba(14,8,6,.88);border:1px solid #4a3528;border-radius:12px;padding:8px}
.vinfo{display:flex;flex-direction:column;align-items:center;min-width:0;line-height:1.2}.vinfo b{font-family:var(--display);font-weight:400;font-size:18px}.vinfo span{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ctrlpick{display:flex;flex-direction:column;align-items:center;gap:5px}
.ctrlpick>span{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.ctrlpick small{font-size:11.5px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;justify-content:center;background:rgba(0,0,0,.3);border:1px solid #4a3528;border-radius:10px;padding:3px;gap:2px}
.seg button{font-family:var(--ui);font-weight:700;font-size:13px;color:var(--ink);background:none;border:none;border-radius:7px;padding:6px 11px;cursor:pointer}
.seg button.on{background:var(--accent);color:#2a1405}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
body.kb #joy,body.kb #fireWrap{display:none}
body.kb #app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"hud" "board";max-width:1100px}
.pbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #9a4a10}
#joy{grid-area:dpad;justify-self:start;position:relative;width:130px;height:130px;border-radius:50%;touch-action:none;cursor:pointer;
  background:radial-gradient(circle at 50% 45%,#2e2019 0%,#1c130f 70%,#120b08 100%);box-shadow:inset 0 3px 10px rgba(0,0,0,.7),0 0 0 2px #4b3426,0 6px 18px rgba(0,0,0,.45)}
#ring{position:absolute;inset:14px;border-radius:50%;border:2px dashed rgba(255,181,46,.18)}
#joy::before,#joy::after{content:"";position:absolute;left:50%;top:50%;background:rgba(255,181,46,.12);transform:translate(-50%,-50%)}
#joy::before{width:2px;height:70%}#joy::after{width:70%;height:2px}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;transition:transform 60ms ease-out;border-radius:50%;z-index:1;
  background:radial-gradient(circle at 38% 32%,#ffe7a0,#ffb52e 45%,#c8600e 100%);box-shadow:0 5px 0 #6a300a,0 10px 18px rgba(0,0,0,.5),inset 0 -4px 8px rgba(0,0,0,.25);will-change:transform}
#joy.on #knob{box-shadow:0 2px 0 #6a300a,0 6px 12px rgba(0,0,0,.5),inset 0 -4px 8px rgba(0,0,0,.25)}
#joy.on #ring{border-color:rgba(255,181,46,.45)}
#fireWrap{grid-area:fire;justify-self:end;display:flex;flex-direction:column;align-items:center;gap:6px}
#fire{width:80px;height:80px;border-radius:50%;border:none;cursor:pointer;touch-action:none;padding:0;position:relative;
  background:conic-gradient(var(--cool) calc(var(--c,1)*360deg),#2c3a44 0);box-shadow:0 5px 0 #08121a,0 10px 24px rgba(0,0,0,.5)}
#fire::after{content:"FIRE";position:absolute;inset:6px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:15px;color:#06202c;
  background:radial-gradient(circle at 35% 30%,#d6f7ff,#59d6ff 45%,#1b88b8);}
#fire.empty::after{background:radial-gradient(circle at 35% 30%,#56616a,#33404a 60%,#222b33);color:#7d8a94}
#fire.on{transform:translateY(3px);box-shadow:0 2px 0 #08121a}
.hint{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.pbtn,.dbtn,#fire{transition:none}}
@media (max-height:520px){.how{display:none}.logo{font-size:30px}.logo br{display:none}.ovin{gap:6px}.sub{font-size:13px}.pbtn{padding:9px 26px;font-size:18px}.big{font-size:24px}}
.ver{font-size:11px;color:var(--muted);opacity:.7;letter-spacing:.06em}
/* 4.0: level select, stars, daily button, first-minute hints */
.ovin.wide{max-width:640px;width:100%}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;width:100%}
.lvb:disabled{opacity:.3;cursor:default}.lvb.vault{border-color:var(--accent)}
.stars{font-size:40px;line-height:1;color:#ffd23a;letter-spacing:6px;text-shadow:0 3px 0 #9a4a10}.stars span{color:rgba(255,255,255,.18);text-shadow:none}
.pbtn.daily{background:linear-gradient(#bfe9ff,#59d6ff);box-shadow:0 4px 0 #1b6f94,0 8px 18px rgba(0,0,0,.4);color:#062433}.pbtn:disabled{opacity:.6;cursor:default}
#hint{position:fixed;z-index:6;left:50%;top:58px;transform:translateX(-50%);max-width:min(90vw,520px);box-sizing:border-box;padding:9px 16px;border-radius:12px;
  background:rgba(14,8,6,.88);border:1px solid var(--accent);color:var(--ink);font:700 14px/1.35 var(--ui);text-align:center;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
[hidden]{display:none!important}
</style>

<div id="rot" aria-live="polite"><svg viewBox="0 0 96 96" aria-hidden="true"><rect x="30" y="10" width="36" height="76" rx="7" fill="none" stroke="#ffb52e" stroke-width="5"/><circle cx="48" cy="76" r="3.5" fill="#ffb52e"/></svg><b>Turn your phone sideways</b><span>Digga-Digga is played with your phone on its side.</span></div>
<div id="app">
  <div id="hud">
    <div class="stat"><span>Score</span><b id="sc">0</b></div>
    <div class="stat"><span>Level</span><b id="lv">1</b></div>
    <div class="stat" id="bestStat"><span>Best</span><b id="hs">0</b></div>
    <div class="stat"><span>Rigs</span><div id="lives"></div></div>
    <div class="hbtns">
      <button class="ibtn" id="dprev" aria-label="Previous level" hidden><svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="3" height="14" rx="1"/><path d="M19 5v14L9 12z"/></svg></button>
      <button class="ibtn" id="dnext" aria-label="Next level" hidden><svg viewBox="0 0 24 24" fill="currentColor"><rect x="16" y="5" width="3" height="14" rx="1"/><path d="M5 5v14l10-7z"/></svg></button>
      <button class="ibtn" id="mute" aria-label="Sound on or off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="mw" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
      <button class="ibtn" id="pause" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    </div>
  </div>
  <div id="board"><div id="stage"><canvas id="cv"></canvas></div><div id="ov" class="dim"></div></div>
  <div id="joy" aria-label="Joystick: drag to move"><div id="ring"></div><div id="knob"></div></div>
  <div id="jzone" aria-hidden="true"></div>
  <div id="hint" role="status" hidden></div>
  <div id="fireWrap"><button id="fire" aria-label="Fire"></button><span class="hint">or tap the board</span></div>
</div>

<script>
(()=>{
// Version number: change it for every release. The Android build reads it from here, and it shows on the title screen.
const VERSION='4.0';
let W=12,H=8;
// ---------- level generator: 100+ fixed layouts, one seed per level ----------
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// 3.0: the game builds up over 100 levels. fOf() goes from 0 at level 1 to 1 at level 30: by then the board is full size (20x14),
// there are 60 emeralds and the Grubs are at what used to be level 100. Levels 1-5 stay on the smallest board while you learn.
const fOf=i=>Math.min(1,i/29);
function levelSize(i){const k=Math.max(0,i-4);return{w:12+Math.min(8,Math.floor(k/3.1)),h:8+Math.min(6,Math.floor(k/4.1))}}
function gemTarget(i){return Math.round(10+Math.min(i,29)*50/29)}
// Level styles (1.9): each level picks a style so levels feel different from each other. Levels 1-3 are always Tunnels;
// after that it's seeded per level, never the same style twice in a row.
const STYLES=['Tunnels','Caverns','Maze','Shafts','Chambers','Mirror','Vault'];
// 4.0: every 10th level (10, 20 ... 100) is a showpiece: the Vault, a walled room packed with emeralds
const showpiece=i=>i%10===9;
// the daily challenge picks its style from the day's seed instead of the level number
const styleOf=(i,seed)=>seed!=null?Math.floor(mulberry(seed+77)()*6):levelStyle(i);
function levelStyle(i){if(showpiece(i))return 6;let s=0;for(let j=3;j<=i;j++){let n=Math.floor(mulberry(j*131+9)()*6);if(n===s)n=(n+1)%6;s=n}return s}
function genLevel(i,seed){
  const{w,h}=levelSize(i),R=mulberry(seed!=null?seed:i*7919+1234),ri=(a,b)=>a+Math.floor(R()*(b-a+1)),f=fOf(i);
  const g=[...Array(h)].map(()=>Array(w).fill('#'));const style=styleOf(i,seed),sym=style===5;
  const carve=(x,y)=>{if(x>=0&&y>=0&&x<w&&y<h)g[y][x]='.'};
  const path=(x,y,tx,ty)=>{const hz=R()<.5;if(hz)while(x!==tx){carve(x,y);x+=Math.sign(tx-x)}while(y!==ty){carve(x,y);y+=Math.sign(ty-y)}while(x!==tx){carve(x,y);x+=Math.sign(tx-x)}carve(x,y)};
  function corridor(x,y,turns,maxLen){let hz=R()<.6;
    for(let t=0;t<=turns;t++){const len=ri(2,Math.max(3,Math.floor((hz?w:h)*maxLen)));const dir=R()<.5?-1:1;
      for(let s=0;s<len;s++){carve(x,y);const nx=hz?x+dir:x,ny=hz?y:y+dir;if(nx<0||ny<0||nx>=w||ny>=h)break;x=nx;y=ny}carve(x,y);hz=!hz}}
  if(style===0||style===5||style===6){ // Tunnels: a few straight tunnels with bends. Mirror: the same on the left half, copied to the right
    const nCor=1+Math.round(f*4)+Math.floor(w*h/90);
    for(let k=0;k<nCor;k++){const x=sym?ri(0,Math.floor(w/2)-1):ri(0,w-1);corridor(x,ri(0,h-1),ri(1,2),.25+f*.3)}
    if(sym)for(let y=0;y<h;y++)for(let x=0;x<Math.floor(w/2);x++)g[y][w-1-x]=g[y][x];
  }else if(style===1){ // Caverns: a few big oval caves joined by tunnels
    const n=2+Math.floor(w*h/120),cs=[];
    for(let k=0;k<n;k++){const rx=ri(2,3),ry=ri(1,2),cx=ri(rx,w-1-rx),cy=ri(ry,h-1-ry);cs.push([cx,cy]);
      for(let y=cy-ry;y<=cy+ry;y++)for(let x=cx-rx;x<=cx+rx;x++)if(((x-cx)/(rx+.5))**2+((y-cy)/(ry+.5))**2<=1)carve(x,y)}
    for(let k=1;k<n;k++)path(cs[k-1][0],cs[k-1][1],cs[k][0],cs[k][1]);
  }else if(style===2){ // Maze: a grid of junctions 3 squares apart, joined like a maze, with some dead ends
    const ox=ri(0,1),oy=ri(0,1),cw=Math.floor((w-1-ox)/3)+1,ch=Math.floor((h-1-oy)/3)+1,seen=new Set(),st=[[ri(0,cw-1),ri(0,ch-1)]];
    seen.add(st[0]+'');carve(ox+st[0][0]*3,oy+st[0][1]*3);
    while(st.length){const[a,b]=st[st.length-1];const nb=[[1,0],[-1,0],[0,1],[0,-1]].map(([p,q])=>[a+p,b+q]).filter(([p,q])=>p>=0&&q>=0&&p<cw&&q<ch&&!seen.has(p+','+q));
      if(!nb.length){st.pop();continue}const[p,q]=nb[ri(0,nb.length-1)];seen.add(p+','+q);st.push([p,q]);
      if(R()<.78)path(ox+a*3,oy+b*3,ox+p*3,oy+q*3);else carve(ox+p*3,oy+q*3)}

function updHud(){$('sc').textContent=score.toLocaleString();$('lv').textContent=daily?'Daily':lvl+1;$('bestStat').hidden=dev;$('dprev').hidden=$('dnext').hidden=!dev;$('hs').textContent=hi.toLocaleString();$('bestStat').firstChild.textContent=diff==='medium'?'Best':D().name+' best';
  const rig='<svg viewBox="0 0 20 16"><rect x="1" y="3" width="12" height="8" rx="2" fill="#ffb52e"/><rect x="3" y="4.5" width="5" height="3.5" rx="1" fill="#7fe8ff"/><path d="M13 3.5L19 7.5 13 11z" fill="#d7dee6"/><rect x="1" y="11" width="12" height="4" rx="2" fill="#3a3a46"/></svg>';
  $('lives').innerHTML=rig.repeat(Math.min(lives,6))}
function burst(x,y,col,n=14,sp=3,size=.08,grav=6){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=rnd(.3,1)*sp;
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,life:rnd(.4,.9),t:0,col,size:size*rnd(.6,1.3),grav})}}

/* ---------- player ---------- */
const PSPEED=3.5;
function startMove(P,d){P.face=d;const nx=P.cx+d[0],ny=P.cy+d[1];if(!inB(nx,ny)||rk[ny][nx])return false;
  const b=bagAt(nx,ny);
  if(b){if(d[1]!==0||b.state!=='rest')return false;const bx=nx+d[0];
    if(!inB(bx,ny)||rk[ny][bx]||bagAt(bx,ny)||em[ny][bx]||gold[ny][bx])return false;
    for(const e of enemies){const p=pos(e);if(Math.abs(p.x-bx)<.8&&Math.abs(p.y-ny)<.8)return false}
    b.x=bx;b.state='slide';play('push')}
  P.tx=nx;P.ty=ny;P.p=0;P.dig=!(grid[ny][nx]&&edgeOpen(P.cx,P.cy,nx,ny));return true}
function arrive(e){openEdge(e.cx,e.cy,e.tx,e.ty);if(!grid[e.ty][e.tx])grid[e.ty][e.tx]=1;e.cx=e.tx;e.cy=e.ty;e.p=0;e.dig=false}
function updPlayer(dt){
  const P=player;if(P.dead){P.deadT+=dt;if(P.deadT>2)afterDeath();return}
  const d=inputDir();
  if(moving(P)){
    if(d&&d[0]===-(P.tx-P.cx)&&d[1]===-(P.ty-P.cy)){[P.cx,P.tx]=[P.tx,P.cx];[P.cy,P.ty]=[P.ty,P.cy];P.p=1-P.p;P.dig=false;P.face=d}
    else if(d&&(d[0]!==P.tx-P.cx||d[1]!==P.ty-P.cy)&&P.p<.3){const sv={tx:P.tx,ty:P.ty,p:P.p,dig:P.dig,face:P.face};
      P.tx=P.cx;P.ty=P.cy;P.p=0;P.dig=false;if(!startMove(P,d))Object.assign(P,sv)}
    P.p+=PSPEED*dt*(P.dig?.82:1);P.spin+=dt*(P.dig?30:14);
    if(P.dig&&Math.random()<dt*14){const p=pos(P);parts.push({x:p.x+P.face[0]*.45,y:p.y+P.face[1]*.45,vx:rnd(-1.5,1.5)-P.face[0],vy:rnd(-2,0),life:rnd(.3,.6),t:0,col:PALS[lvl%PALS.length].b[1],size:rnd(.04,.08),grav:8});if(Math.random()<.35)play('dig')}
    if(P.p>=1){arrive(P);if(d)startMove(P,d)}
  }else if(d)startMove(P,d);
  const p=pos(P),gx=Math.round(p.x),gy=Math.round(p.y);
  if(inB(gx,gy)&&Math.hypot(p.x-gx,p.y-gy)<.45){
    if(em[gy][gx]){em[gy][gx]=false;emCount--;addScore(25);burst(gx,gy,'#5dffb0',10,2.5,.06,3);play('gem');
      streak=(time-streakT<1.3)?streak+1:1;streakT=time;
      if(streak>=8){streak=0;addScore(250,gx,gy-.3);play('combo')}}
    if(gold[gy][gx]){gold[gy][gx]=0;addScore(500,gx,gy);burst(gx,gy,'#ffd34d',18,3,.07,4);play('gold')}
  }
  if(bonusItem&&Math.hypot(p.x-bonusItem.x,p.y-bonusItem.y)<.6){addScore(1000,bonusItem.x,bonusItem.y);burst(bonusItem.x,bonusItem.y,'#ffe066',24,4,.08,2);
    bonusItem=null;bonusT=bonusDur;eatChain=0;play('bonus')}
}
function killPlayer(){if(player.dead||devGod)return;player.dead=true;player.deadT=0;const p=pos(player);
  burst(p.x,p.y,'#ffb52e',30,5,.1,5);burst(p.x,p.y,'#ff5468',16,4,.08,5);shake=.5;play('die');buzz([80,60,160])}
function afterDeath(){lives--;levelDeaths++;updHud();
  if(lives<=0){if(daily)endDaily();else setPhase('over');return}
  if(enemies.some(e=>e.shooter))shooterAvail=true;eShots=[];
  spawned-=enemies.length;enemies=[];bullets=[];bonusT=0;spawnT=3;resetPlayer();setPhase('intro')}

/* ---------- bags ---------- */
function freeBelow(x,y){const by=y+1;return inB(x,by)&&grid[by][x]&&!bagAt(x,by)&&!gold[by][x]&&!em[by][x]}
function updBags(dt){
  for(const b of [...bags]){
    if(b.state==='slide'){const dir=Math.sign(b.x-b.fx);b.fx+=dir*PSPEED*dt;if((b.x-b.fx)*dir<=0){b.fx=b.x;b.state='rest'}continue}
    if(b.state==='rest'&&freeBelow(b.x,b.y)){b.state='wobble';b.t=0}
    if(b.state==='wobble'){b.t+=dt;if(!freeBelow(b.x,b.y)){b.state='rest';continue}
      if(b.t>(.95-fOf(dI(lvl))*.4)*(1-late(dI(lvl))*.2)*D().wob){b.state='fall';b.startY=b.y;b.y++}}
    if(b.state==='fall'){b.fy+=7.5*dt;
      for(const e of [player,...enemies]){if(e.dead)continue;const p=pos(e);
        if(Math.abs(p.x-b.fx)<.6&&p.y-b.fy>-.1&&p.y-b.fy<.95){if(e===player)killPlayer();else if(!e.gone){killEnemy(e,250,'#ff7a8a');hitStop=.09;flashT=.15;buzz(70)}}}
      if(b.fy>=b.y){b.fy=b.y;openEdge(b.x,b.y-1,b.x,b.y);grid[b.y][b.x]=1;
        if(freeBelow(b.x,b.y))b.y++;
        else{const fallen=b.y-b.startY;
          if(fallen>=2){bags.splice(bags.indexOf(b),1);gold[b.y][b.x]=1;burst(b.x,b.y,'#ffd34d',22,4,.08,6);shake=Math.max(shake,.25);play('break');buzz(45)}
          else{b.state='rest';shake=Math.max(shake,.12);play('thud')}}}
    }
  }
}

/* ---------- enemies ---------- */
function canMove(type,x,y,nx,ny){if(!inB(nx,ny)||rk[ny][nx]||bagAt(nx,ny))return false;
  if(type==='nob')return grid[ny][nx]&&grid[y][x]&&edgeOpen(x,y,nx,ny);return!em[ny][nx]}
const bfsCache={};
function distMap(type){const key=type+frame;if(bfsCache.k===key)return bfsCache.m;
  const p=pos(player),sx=Math.round(p.x),sy=Math.round(p.y),m=[];for(let y=0;y<H;y++)m[y]=new Array(W).fill(Infinity);
  const q=[[sx,sy]];m[sy][sx]=0;
  while(q.length){const[x,y]=q.shift();for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;
    if(inB(nx,ny)&&m[ny][nx]===Infinity&&(type==='hob'?(!rk[ny][nx]&&!bagAt(nx,ny)&&!em[ny][nx]):canMove('nob',x,y,nx,ny))){m[ny][nx]=m[y][x]+1;q.push([nx,ny])}}}
  bfsCache.k=key;bfsCache.m=m;return m}
function decide(e){
  const opts=[];for(const d of[[1,0],[-1,0],[0,1],[0,-1]])if(canMove(e.type,e.cx,e.cy,e.cx+d[0],e.cy+d[1]))opts.push(d);
  if(!opts.length)return;
  let pool=opts.filter(d=>!(d[0]===-e.ld[0]&&d[1]===-e.ld[1]));if(!pool.length)pool=opts;
  const m=distMap(e.type);let best=null;
  if(Math.random()<.12)best=pool[Math.random()*pool.length|0];
  else{let bv=bonusT>0?-1:Infinity;
    for(const d of pool){let v=m[e.cy+d[1]][e.cx+d[0]];if(bonusT>0){if(v===Infinity)v=99;if(v>bv){bv=v;best=d}}else if(v<bv){bv=v;best=d}}
    if(!best)best=pool[Math.random()*pool.length|0]}
  e.tx=e.cx+best[0];e.ty=e.cy+best[1];e.p=0;e.ld=best;e.dig=!(grid[e.ty][e.tx]&&edgeOpen(e.cx,e.cy,e.tx,e.ty))}
function spawnEnemy(){enemies.push({cx:spawnCell.x,cy:spawnCell.y,tx:spawnCell.x,ty:spawnCell.y,p:0,ld:[0,0],type:'nob',born:0,hobT:((20-fOf(dI(lvl))*15)+rnd(0,8))*(1-late(dI(lvl))*.3)*D().gnash,hobLeft:0,dig:false,wob:Math.random()*6,bs:Math.random()*3.4,gx:0,gy:0,step:0});const ne=enemies[enemies.length-1];if(shooterAvail&&spawned>=1){ne.shooter=true;ne.shotT=2;ne.aim=0;shooterAvail=false}spawned++;play('spawn')}
function updEnemies(dt){if(devFreeze)return;
  // 3.2 (Steven: "i don't want the level to end when all grubs die. Respawn them"): once every Grub of the level has been
  // beaten, a fresh lot starts coming out of the burrow (firing Grub included), so a level only ends when the emeralds are gone
  if(spawned>=total&&!enemies.length){spawned=0;shooterAvail=dI(lvl)>=9;spawnT=interval}
  if(spawned<total&&enemies.length<maxOn){spawnT-=dt;if(spawnT<=0){spawnEnemy();spawnT=interval}}
  // Medium (3.0): 2.6 squares a second at level 1 while you learn, quickly up to 3.35 at level 30 (just under the rig's 3.5,
  // Steven 2.8), then 3.9 by level 100, passing the rig at about level 50
  const sp=(2.6+Math.sqrt(fOf(dI(lvl)))*.75)*(1+late(dI(lvl))*.164)*D().sp;
  for(const e of enemies){e.born+=dt;e.wob+=dt*8;if(moving(e))e.step+=dt*15;if(e.born<.7)continue;
    if(e.type==='nob'){e.hobT-=dt;if(e.hobT<=0&&!moving(e)&&bonusT<=0){e.type='hob';e.hobLeft=rnd(5,9);burst(e.cx,e.cy,'#b07cff',8,2,.05,0)}}
    else{e.hobLeft-=dt;if(e.hobLeft<=0&&!moving(e)&&grid[e.cy][e.cx]){e.type='nob';e.hobT=((16-fOf(dI(lvl))*10)+rnd(0,6))*(1-late(dI(lvl))*.3)*D().gnash}}
    if(e.shooter&&!player.dead)shooterTick(e,dt);
    if(e.aim>0){}else if(moving(e)){const s=(e.type==='hob'?sp*.8:sp)*(e.dig?.55:1)*(bonusT>0?.7:1);e.p+=s*dt;
      if(e.dig&&Math.random()<dt*8){const p=pos(e);parts.push({x:p.x,y:p.y,vx:rnd(-1.5,1.5),vy:rnd(-2,0),life:.4,t:0,col:PALS[lvl%PALS.length].b[2],size:.05,grav:8})}
      if(e.p>=1){arrive(e);decide(e)}}
    else decide(e);
    if(!player.dead){const a=pos(e),b=pos(player);if(Math.hypot(a.x-b.x,a.y-b.y)<.62){
      if(bonusT>0){eatChain++;const pts=200*Math.pow(2,Math.min(eatChain-1,4));killEnemy(e,pts,'#59d6ff');play('eat')}else killPlayer()}}
  }
  enemies=enemies.filter(e=>!e.gone);
}
// Firing Grub (2.2): from level 10 since 3.0 (not on breather levels that play easier), the second Grub out on each level can shoot.
// It only fires along a straight open tunnel at the rig, up to 9 squares away. It stops and glows for a moment first,
// so there's time to react. Its shots are slower than yours, stop at earth, rocks and bags, and your shots cancel them.
// It doesn't fire while the star fruit has the Grubs scared. If it's killed, there's no other shooter that level.
// The firing Grub's fireballs travel half a square a second quicker than the rig (Steven, 3.0)
const ESHOT=PSPEED+.5;
function shotGap(){return(4-1.5*late(dI(lvl)))*D().gap}
function lineToPlayer(e){const p=pos(player),px=Math.round(p.x),py=Math.round(p.y);let x=e.cx,y=e.cy;
  if(moving(e)){const q=pos(e);x=Math.round(q.x);y=Math.round(q.y)}
  if(x!==px&&y!==py)return null;const d=[Math.sign(px-x),Math.sign(py-y)];if(!d[0]&&!d[1])return null;
  for(let k=0;k<9;k++){const nx=x+d[0],ny=y+d[1];if(!inB(nx,ny)||!grid[ny][nx]||!edgeOpen(x,y,nx,ny)||bagAt(nx,ny))return null;x=nx;y=ny;if(x===px&&y===py)return d}
  return null}
function shooterTick(e,dt){if(e.aim>0){e.aim-=dt;if(e.aim<=0){const p=pos(e);eShots.push({x:p.x,y:p.y,d:e.aimD,t:0});play('ezap')}return}
  if(bonusT>0)return;e.shotT-=dt;if(e.shotT>0)return;const d=lineToPlayer(e);if(!d)return;e.aim=.5;e.aimD=d;e.shotT=shotGap()}
function updEShots(dt){
  for(const s of eShots){s.t+=dt;s.x+=s.d[0]*ESHOT*dt;s.y+=s.d[1]*ESHOT*dt;
    const cx=Math.round(s.x),cy=Math.round(s.y),ax=Math.round(s.x+s.d[0]*.45),ay=Math.round(s.y+s.d[1]*.45);
    if(ax!==cx||ay!==cy){if(!inB(ax,ay)||!grid[ay][ax]||!inB(cx,cy)||!edgeOpen(cx,cy,ax,ay)||bagAt(ax,ay)){s.dead=true;burst(s.x+s.d[0]*.4,s.y+s.d[1]*.4,'#ff9a3c',8,2,.05,0)}}
    for(const b of bullets)if(!b.dead&&Math.hypot(b.x-s.x,b.y-s.y)<.5){b.dead=s.dead=true;burst(s.x,s.y,'#ffe0a0',12,3,.06,0)}
    const p=pos(player);if(!s.dead&&!player.dead&&Math.hypot(p.x-s.x,p.y-s.y)<.5){s.dead=true;killPlayer()}
    if(s.t>3)s.dead=true}
  eShots=eShots.filter(s=>!s.dead);bullets=bullets.filter(b=>!b.dead)}
// shooting or squashing a Grub is 250 points; the firing Grub is worth 1,000 (4.0)
function killEnemy(e,pts,col){if(e.gone)return;e.gone=true;const p=pos(e),norm=pts===250;if(norm&&e.shooter)pts=1000;kills++;addScore(pts,p.x,p.y);burst(p.x,p.y,col,18,4,.08,4);if(norm)play('kill');shake=Math.max(shake,.1);buzz(30)}

/* ---------- fire ---------- */
function fire(){if(phase!=='play'||paused||player.dead||fireCool>0)return;firedOnce=true;const p=pos(player);
  bullets.push({x:p.x,y:p.y,d:player.face,t:0});fireCool=devFire?0:fireMax;play('zap')}
function updBullets(dt){
  for(const b of bullets){b.t+=dt;b.x+=b.d[0]*9*dt;b.y+=b.d[1]*9*dt;
    const cx=Math.round(b.x),cy=Math.round(b.y),ax=Math.round(b.x+b.d[0]*.45),ay=Math.round(b.y+b.d[1]*.45);
    if(ax!==cx||ay!==cy){if(!inB(ax,ay)||!grid[ay][ax]||!inB(cx,cy)||!edgeOpen(cx,cy,ax,ay)||bagAt(ax,ay)){b.dead=true;burst(b.x+b.d[0]*.4,b.y+b.d[1]*.4,'#9ff0ff',8,2,.05,0)}}
    for(const e of enemies){if(e.gone||e.born<.7)continue;const p=pos(e);if(Math.hypot(p.x-b.x,p.y-b.y)<.55){b.dead=true;killEnemy(e,250,'#ff7a8a')}}
    if(b.t>3)b.dead=true}
  bullets=bullets.filter(b=>!b.dead)}

/* ---------- main update ---------- */
function update(dt){
  time+=dt;frame++;shake=Math.max(0,shake-dt);flashT=Math.max(0,flashT-dt);musicTick();
  for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.grav*dt}parts=parts.filter(p=>p.t<p.life);
  for(const p of pops)p.t+=dt;pops=pops.filter(p=>p.t<1.1);
  if(paused||phase==='title'||phase==='over'||phase==='dev'||phase==='view'||phase==='levels')return;
  phaseT+=dt;
  // one Grub comes out as soon as each level starts (Steven, 1.8); the rest follow on the usual timer
  if(phase==='intro'){if(phaseT>1.6){setPhase('play');if(firstOut)startHints();if(firstOut&&!devFreeze){firstOut=false;spawnEnemy()}}return}
  if(phase==='clear'){if(phaseT>3){if(daily){endDaily();return}lvl++;loadLevel(lvl);noteReach(lvl);updHud();setPhase('intro')}return}
  // a short pause when a bag squashes a Grub, so the hit lands
  if(hitStop>0){hitStop-=dt;return}
  levelTime+=dt;updHint(dt);
  fireCool=Math.max(0,fireCool-dt);
  if(bonusT>0)bonusT=Math.max(0,bonusT-dt);
  updPlayer(dt);updBags(dt);updEnemies(dt);updBullets(dt);updEShots(dt);
  if(spawned>=total&&!bonusSpawned){bonusWait+=dt;if(bonusWait>2){bonusSpawned=true;bonusItem={x:spawnCell.x,y:spawnCell.y,t:0}}}
  if(bonusItem){bonusItem.t+=dt;if(bonusItem.t>14)bonusItem=null}
  if(!player.dead&&emCount<=0)levelDone();
}
function levelDone(){addScore(0);hintStep=-1;
  if(!daily){lastStars=1+(levelDeaths?0:1)+(levelTime<=parTime(lvl)?1:0);if(!dev&&lastStars>(prog.stars[lvl]||0)){prog.stars[lvl]=lastStars;ls.set(progKey(),prog)}}
  buzz([30,60,30]);setPhase('clear');play('clear')}
// First-minute hints (4.0): on level 1, shown one at a time until they've been seen once
let hintStep=-1,hintT=0;
function startHints(){hintStep=lvl===0&&!dev&&!daily&&!ls.get('diggaHints',false)?0:-1;hintT=0;showHint()}
function showHint(){const el=$('hint');if(hintStep<0||phase!=='play'||paused){el.hidden=true;return}const kb=kbMode();
  el.textContent=[kb?'Use the arrow keys to move and dig':'Slide your thumb on the joystick to move and dig',
    kb?'Press Shift to fire at the Grubs':'Tap FIRE to shoot the Grubs',
    'Dig under a gold bag: it drops on any Grub below, and bursts into gold if it falls 2 rows'][hintStep];el.hidden=false}
function updHint(dt){if(hintStep<0)return;hintT+=dt;const moved=player.cx!==startCell.x||player.cy!==startCell.y;
  if((hintStep===0&&moved&&hintT>2)||(hintStep===1&&firedOnce&&hintT>1)||hintT>(hintStep===2?8:10)){hintStep++;hintT=0;firedOnce=false;
    if(hintStep>2){hintStep=-1;ls.set('diggaHints',true)}showHint()}}

/* ---------- drawing ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
// 3.5: on a stretched map (SX) the sideways sizes are divided by SX, so tunnels are the same width both ways and the ends stay round
function tunnelPath(w){ctx.beginPath();const r=w/2,rx=r/SX;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(!grid[y][x])continue;const X=(x+.5)*T,Y=(y+.5)*T;ctx.moveTo(X+rx,Y);ctx.ellipse(X,Y,rx,r,0,0,6.2832);
    if(x<W-1&&hE[y][x])ctx.rect(X,Y-r,T,w);if(y<H-1&&vE[y][x])ctx.rect(X-rx,Y,rx*2,T)}
  for(const e of[player,...enemies]){if(!e.dig||!moving(e)||e.dead)continue;const p=pos(e),X0=(e.cx+.5)*T,Y0=(e.cy+.5)*T,X1=(p.x+.5)*T,Y1=(p.y+.5)*T;
    ctx.rect(Math.min(X0,X1)-(e.tx!==e.cx?0:rx),Math.min(Y0,Y1)-(e.ty!==e.cy?0:r),Math.abs(X1-X0)+(e.tx!==e.cx?0:rx*2),Math.abs(Y1-Y0)+(e.ty!==e.cy?0:w));
    ctx.moveTo(X1+rx,Y1);ctx.ellipse(X1,Y1,rx,r,0,0,6.2832)}
  for(const b of bags)if(b.state==='fall'||(b.state==='slide')){}
}
function drawTunnels(){const pal=PALS[lvl%PALS.length];
  ctx.fillStyle='rgba(0,0,0,.38)';tunnelPath(T*.92);ctx.fill();
  ctx.fillStyle=pal.t;tunnelPath(T*.8);ctx.fill();
  ctx.save();ctx.globalAlpha=.07;ctx.fillStyle='#fff';ctx.translate(-T*.04/SX,-T*.06);tunnelPath(T*.62);ctx.fill();ctx.restore();
  ctx.fillStyle=pal.t;ctx.save();ctx.translate(T*.02/SX,T*.03);tunnelPath(T*.66);ctx.fill();ctx.restore();}
// Sprites rendered in Blender (art/make_sprites.py). tools/embed-art.js writes them into the ART line below.

function drawEnemy(e){const p=pos(e),X=(p.x+.5)*T,Y=(p.y+.5)*T,s=T*.38;ctx.save();ctx.translate(X,Y);US();
  const k=Math.min(1,e.born/.7);ctx.scale(k,k);if(e.born<.7)ctx.globalAlpha=k;

    ctx.strokeStyle=flash?'#c21d55':'#fff';ctx.lineWidth=Math.max(1,T*.035);ctx.beginPath();for(let i=0;i<=6;i++)ctx.lineTo(-s*.45+i*s*.15,s*.2+(i%2?-1:1)*s*.08);ctx.stroke()}
  else{for(const sx of[-1,1]){ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(sx*s*.32,-s*.22,s*.24,blink?s*.04:s*.28,0,0,7);ctx.fill();if(blink)continue;
      ctx.fillStyle='#1a0b14';ctx.beginPath();ctx.arc(sx*s*.32+lx,-s*.2+ly,s*.12,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx*s*.32+lx-s*.04,-s*.25+ly,s*.04,0,7);ctx.fill()}

// Rocks: grey stone blocks that nothing can dig through. The shape varies a little per square so they look natural.
function drawRock(x,y){const X=(x+.5)*T,Y=(y+.5)*T,s=T*.48,h1=hash(x*3+1,y*5+2),h2=hash(x*7+3,y*2+5);

  ctx.fillStyle="rgba(255,255,255,.28)";ctx.beginPath();ctx.ellipse(-s*.38,-s*.42,s*.28,s*.13,-.6,0,7);ctx.fill();ctx.restore()}
// Walls: dressed stone blocks that join up with neighbouring wall squares, so a wall reads as one solid barrier.
function drawWall(x,y){const X=x*T,Y=y*T,i=T*.06,isW=(a,b)=>inB(a,b)&&rk[b][a]===2;
  const l=isW(x-1,y)?0:i,r=isW(x+1,y)?0:i,t=isW(x,y-1)?0:i,b=isW(x,y+1)?0:i;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(X+l+T*.04,Y+t+T*.06,T-l-r,T-t-b);

  ctx.fillStyle='rgba(255,255,255,.16)';ctx.fillRect(X+l,Y+t,T-l-r,Math.max(1,T*.06));ctx.fillRect(X+l,Y+T*.5+T*.03,T-l-r,Math.max(1,T*.04))}

  if(t)ctx.moveTo(X+l,Y+t),ctx.lineTo(X+T-r,Y+t);if(b)ctx.moveTo(X+l,Y+T-b),ctx.lineTo(X+T-r,Y+T-b);ctx.stroke()}
// Stretched map (phones sideways): undo the sideways stretch so a sprite keeps its shape

function drawSpawn(){const X=(spawnCell.x+.5)*T,Y=(spawnCell.y+.5)*T;const g=ctx.createRadialGradient(X,Y,1,X,Y,T*.5);
  g.addColorStop(0,'rgba(255,60,90,'+(.25+Math.sin(time*3)*.1)+')');g.addColorStop(1,'rgba(255,60,90,0)');ctx.fillStyle=g;ctx.fillRect(X-T*.5,Y-T*.5,T,T)}

function drawArrows(){if(!zoomed||phase==='title')return;ctx.setTransform(1,0,0,1,0,0);const w=cv.width,h=cv.height,m=T*.32,s=T*.26;
  const its=enemies.map(e=>({p:pos(e),c:bonusT>0?'#59d6ff':e.type==='hob'?'#b07cff':e.shooter?'#ff9a3c':'#ff5468'}));if(bonusItem)its.push({p:bonusItem,c:'#ffd23a'});

function draw(){

}

/* ---------- sizing & loop ---------- */
// Zoom: when the whole board would make squares smaller than ZMIN px (big levels on a phone), squares are drawn at ZT px
// and the canvas becomes a window onto the board that follows the rig. Developer View always shows the whole board.
// Sideways on a touch screen the whole map shows below the scores, with the joystick and Fire beside or over it.
// Sideways on a phone (not FILL) the map is stretched sideways to fill the whole screen width (SX, Steven 2.7: "fully wide screen");
// sprites are drawn unstretched (US()) so they keep their shape. FILL=true instead makes the map fill the screen: squares sized to cover it (at least ZT px), with the view following the rig
// (Steven tried this in 1.1-1.4, then asked for the whole map again in 1.5).
const FILL=false;
const ZT=30,ZMIN=26;let camX=0,camY=0,zoomed=false,zs=ZT;
function resize(force){const full=matchMedia('(pointer:coarse)').matches&&innerWidth>innerHeight;document.body.classList.toggle('full',full);
  const box=$('board').getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);
  const fit=Math.min(box.width/W,box.height/H);document.body.classList.toggle('fill',full&&FILL);zoomed=(full?FILL:fit<ZMIN)&&phase!=='view';let bw,bh;
  zs=full&&FILL?Math.max(ZT,box.width/W,box.height/H):ZT;
  if(zoomed){bw=Math.floor(Math.min(box.width,W*zs));bh=Math.floor(Math.min(box.height,H*zs))}
  else if(full){bw=Math.floor(box.width);bh=Math.floor(box.height)}
  else{bw=box.width;bh=bw*H/W;if(bh>box.height){bh=box.height;bw=bh*W/H}bw=Math.max(150,Math.floor(bw));bh=Math.floor(bw*H/W)}
  cv.style.width=bw+'px';cv.style.height=bh+'px';
  const st=full&&!zoomed,nw=Math.round(bw*dpr),nh=zoomed||st?Math.round(bh*dpr):Math.round(nw*H/W),nT=zoomed?zs*dpr:st?nh/H:nw/W,nSX=st?nw/(W*nT):1;
  if(force||cv.width!==nw||cv.height!==nh||T!==nT||SX!==nSX){cv.width=nw;cv.height=nh;T=nT;SX=nSX;buildDirt();camera(0,true)}}
function camera(dt,snap){if(!zoomed||!player){camX=camY=0;return}const p=pos(player);
  const tx=Math.max(0,Math.min(W*T-cv.width,(p.x+.5)*T-cv.width/2));
  // full screen: the view may scroll a little past the top (scores), and past the bottom when the rig is in a bottom corner,
  // so the rig is never hidden under the scores, joystick or Fire
  const full=document.body.classList.contains('full'),sx=(p.x+.5)*T-tx,left=sx<130*dpr,right=sx>cv.width-95*dpr;
  const pt=full?40*dpr:0,pb=full&&left?118*dpr:full&&right?84*dpr:0;
  const ty=Math.max(-pt,Math.min(H*T-cv.height+pb,(p.y+.5)*T-cv.height/2));
  const k=snap?1:Math.min(1,dt*6);camX+=(tx-camX)*k;camY+=(ty-camY)*k}
addEventListener('resize',()=>resize());
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);camera(dt);draw();requestAnimationFrame(loop)}
lvl=0;loadLevel(0);applyCtrl();resize();updHud();showOverlay();requestAnimationFrame(loop);
})();
